name = "companion-discord-bridge"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[vars]
# DISCORD_TOKEN - set via `wrangler secret put DISCORD_TOKEN`
# MCP_SECRET - set via `wrangler secret put MCP_SECRET` (required — random string for URL auth)
# ELEVENLABS_API_KEY - set via `wrangler secret put ELEVENLABS_API_KEY`
